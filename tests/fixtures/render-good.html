<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #f2f2ee; --text: #1e2a47; --muted: #4f5a61; --accent: #1b3fa0; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.7 sans-serif; word-break: keep-all; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14181b; --text: #e6eaeb; --muted: #a3afb4; --accent: #8fa8f0; } }
  main { max-width: 36em; padding: 24px 16px; }
  .muted { color: var(--muted); }
  a, button { color: var(--accent); }
  button { min-height: 44px; min-width: 44px; padding: 10px 18px; font: inherit; background: transparent; border: 1px solid currentColor; }
  a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <h1>원두를 볶은 날</h1>
    <p>매달 둘째 주 화요일에 볶아서 사흘 안에 보냅니다.</p>
    <p class="muted">시험용 깨끗한 페이지</p>
    <p><a href="#plans" style="display:inline-block;padding:12px 0">구독 플랜 보기</a></p>
    <button type="button">자세한 일정 보기</button>
  </main>
</body>
</html>
